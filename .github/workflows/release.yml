name: Publish source release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - run: npm ci --ignore-scripts
      - run: node scripts/check-release.mjs
      - run: npm test
      - run: npm run acceptance
      - run: npm run benchmark
      - run: npm run demo:build
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="docs/RELEASE-${GITHUB_REF_NAME#v}.md"
          if [ -f "$release_notes" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Foliquo ${GITHUB_REF_NAME} - Browser source" --notes-file "$release_notes"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Foliquo ${GITHUB_REF_NAME} - Browser source" --notes "Browser edition: source code only. Download Source code (zip), extract it, and open the Setup-Foliquo file for your computer. Follow README.md and keep your hidden .local folder when updating."
          fi
