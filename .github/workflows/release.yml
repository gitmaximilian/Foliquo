name: Publish source release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "TranslateOCR ${GITHUB_REF_NAME} - Browser source" --notes "Browser edition: source code only. Download Source code (zip), extract it, and open the Setup-TranslateOCR file for your computer. Setup starts the local service and opens your browser. Follow README.md for the full guide. Keep your hidden .local folder when updating."
