name: Publish source release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="docs/RELEASE-${GITHUB_REF_NAME#v}.md"
          if [ -f "$release_notes" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "TranslateOCR ${GITHUB_REF_NAME} - Browser source" --notes-file "$release_notes"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "TranslateOCR ${GITHUB_REF_NAME} - Browser source" --notes "Browser edition: source code only. Download Source code (zip), extract it, and open the Setup-TranslateOCR file for your computer. Follow README.md and keep your hidden .local folder when updating."
          fi
