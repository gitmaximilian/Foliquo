name: Prepare package manager updates
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download verified publishing bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$RELEASE_TAG" --pattern "Foliquo-Packaging-${RELEASE_TAG#v}.zip" --dir metadata
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir metadata
          (cd metadata && sha256sum --ignore-missing -c SHA256SUMS)
          unzip "metadata/Foliquo-Packaging-${RELEASE_TAG#v}.zip" -d metadata/content
          cp packaging/homebrew/README.md metadata/content/homebrew-tap/README.md
          mkdir -p metadata/content/homebrew-tap/.github/workflows
          cp packaging/homebrew/.github/workflows/test.yml metadata/content/homebrew-tap/.github/workflows/test.yml
      - name: Prepare Homebrew tap update branch
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo 'Homebrew update files generated. TAP_GITHUB_TOKEN is absent; download the artifact and push the reviewed tap update manually.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GH_TOKEN="$TAP_TOKEN"
          gh repo clone gitmaximilian/homebrew-tap tap
          cp -R metadata/content/homebrew-tap/. tap/
          cd tap
          git config user.name 'Foliquo release bot'
          git config user.email '175149220+gitmaximilian@users.noreply.github.com'
          branch="codex/foliquo-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add Formula README.md .github/workflows/test.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Update Foliquo from verified release artifacts'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Update Foliquo formula' --body 'Generated from the verified versioned release assets. Review both native Homebrew checks before merging.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-manager-updates
          include-hidden-files: true
          path: metadata/content/
      - name: Report external publication boundary
        run: echo 'WinGet manifests are prepared. They still require official validation, submission to microsoft/winget-pkgs, review and indexing. No Foliquo WinGet availability is implied.' >> "$GITHUB_STEP_SUMMARY"
