name: Test and benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - run: npm ci --ignore-scripts
      - run: node --check server.mjs && node --check desktop/main.mjs && node --check scripts/package-desktop.mjs && node --check scripts/build-icons.mjs && node --check scripts/smoke-desktop.mjs && node --check scripts/launch-desktop.mjs && node --check scripts/install-desktop.mjs
      - run: node scripts/check-install.mjs
      - run: npm test
      - run: npm run benchmark
      - run: npm run demo:build
      - run: npm run acceptance
      - name: Verify Windows handoff archive
        run: node scripts/package-windows.mjs
