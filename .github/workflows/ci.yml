name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure mirror can stall on large LibreOffice packages.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install --cask libreoffice
      - run: node --check server.mjs && node --check scripts/start-browser.mjs && node --check dist/updates.js && node --check dist/workflow.js
      - name: Run the Windows first-use setup check
        if: runner.os == 'Windows'
        run: .\Setup-Foliquo.cmd
        env:
          TRANSLATEOCR_SETUP_NO_START: '1'
      - name: Run the macOS first-use setup check
        if: runner.os == 'macOS'
        run: ./Setup-Foliquo.command
        env:
          TRANSLATEOCR_SETUP_NO_START: '1'
      - name: Run the Linux first-use setup check
        if: runner.os == 'Linux'
        run: ./Setup-Foliquo.sh
        env:
          TRANSLATEOCR_SETUP_NO_START: '1'
      - run: npm test
      - run: npm run benchmark
      - run: npm run demo:build
      - run: npm run acceptance
