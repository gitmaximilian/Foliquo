name: Verify formula
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          brew update
          brew install --cask libreoffice
      - name: Test checked-out tap
        run: |
          brew tap --custom-remote gitmaximilian/tap "$GITHUB_WORKSPACE"
          brew trust --formula gitmaximilian/tap/foliquo
          brew style gitmaximilian/tap/foliquo
          brew audit --strict gitmaximilian/tap/foliquo
          brew install --build-from-source gitmaximilian/tap/foliquo
          brew test gitmaximilian/tap/foliquo
          foliquo --version
          brew uninstall foliquo
