[package]
name = "foliquo-desktop"
version = "0.11.6"
description = "Foliquo desktop window"
authors = ["Maximilian Auer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2.5.3"
serde_json = "1"
sha2 = "0.10"
rfd = "0.15"
ureq = { version = "2.12", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
